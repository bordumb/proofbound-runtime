schema = "proofbound-assumption/1"
id = "PBR-REGISTRY-DISTRIBUTION-AX-014"
statement = "The identified crates.io, PyPI, npm, GitHub Actions, DNS, certificate-authority, and TLS services preserve the configured workflow identity, package-name association, registry metadata, endpoint status, publication result, and package bytes observed by the Runtime release workflow; npm also validates the configured OIDC identity after the package is externally prepared for trusted publishing."
category = "external-provider"
owner = "Proofbound Runtime release maintainer"
rationale = "The workflow compares anonymously retrieved bytes with exact approved packages, but external registries and GitHub supply publisher authentication, name ownership, metadata, availability, and transport. npm requires a credentialed first publication before it can bind an OIDC trusted publisher. Runtime checks one anonymous endpoint status before selecting that route. A 404 does not prove absence, exclude a hidden package, or lock the registry state. Runtime also does not independently prove the registry, token scope, revocation, or identity services."
scope = "Only registry publication and anonymous retrieval observations for PBR-DISTRIBUTION-018 and their current-integration interpretation for PBR-DISTRIBUTION-025."
affected_claims = ["PBR-DISTRIBUTION-018", "PBR-DISTRIBUTION-025"]
review_evidence = [
  ".github/workflows/release.yml",
  "docs/guides/rt7-initial-registry-publication.md",
  "docs/specs/0014_public_compatibility_and_distribution.md",
  "docs/threat-model.md",
  "tools/release/verify_registry_packages.py",
  "tools/release/verify_current_integration.py",
]
discharge_plan = "Use the RT-11 publisher identity and transparency decision when accepted. Retain the external-service premise for registry availability and service behavior."
source_citation = "docs/specs/0014_public_compatibility_and_distribution.md#6-distribution-trust"
