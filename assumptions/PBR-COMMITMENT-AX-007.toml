schema = "proofbound-assumption/1"
id = "PBR-COMMITMENT-AX-007"
statement = "The expected execution-receipt commitment reaches the independent verifier through a channel the malicious receipt carrier cannot alter."
category = "external-provider"
owner = "Proofbound Runtime deployment operator"
rationale = "A self-contained unsigned receipt cannot authenticate its own bytes. Canonical encoding and embedded artifact digests do not prevent a carrier from replacing an unconstrained value and recomputing a valid receipt."
scope = "Only the carrier-integrity interpretation of independent verification and receipt composition for PBR-VERIFY-006 and PBR-COMPOSE-008."
affected_claims = ["PBR-VERIFY-006", "PBR-COMPOSE-008"]
review_evidence = [
  "docs/adr/0002-external-receipt-commitment.md",
  "docs/threat-model.md#malicious-receipt-carrier",
]
discharge_plan = "Supply the expected receipt commitment from an authenticated transport, a separately trusted parent receipt, or an equivalently specified trust anchor. Composition retains the premise but cannot authenticate a commitment delivered through the same replaceable carrier."
source_citation = "docs/adr/0002-external-receipt-commitment.md#decision"
status = "active"
