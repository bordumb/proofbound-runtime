]
discharge_plan = "Retain the kernel, clock, scheduler, memory-ordering, pipe, and thread premises. Narrow them with native cgroup-drift, membership, deadline, process-tree, forced-cleanup, counter, descendant-writer, cancellation, and join fixtures on each supported architecture and exact released-host observations."
