id = "PBR-DIAGNOSTIC-LIFECYCLE-AX-023"
statement = "On an identified supported Linux host, ptrace terminal observations and pidfd-directed signals, cgroup version 2 control readbacks, membership, kill, drain, resource counters, and removal, monotonic clock progress, scheduler progress, pipe end-of-file delivery, atomic cancellation visibility, and thread joins have the documented meaning used by the bounded diagnostic lifecycle source contract."
