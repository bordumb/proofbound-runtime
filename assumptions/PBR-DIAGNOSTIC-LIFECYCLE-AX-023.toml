schema = "proofbound-assumption/1"
id = "PBR-DIAGNOSTIC-LIFECYCLE-AX-023"
statement = "On an identified supported Linux host, ptrace process-tree events and stops, system-call information, exact wait results, procfs thread-group identity, pidfds, and pidfd-directed signals have the documented kernel meaning used by the bounded diagnostic lifecycle source contract, including complete event reporting, retained wait ownership, stable pidfd identity, and the rule that a stopped tracee cannot create another child before the tracer resumes it; cgroup version 2 control readbacks, membership, kill, drain, resource counters, and removal, monotonic clock progress, scheduler progress, pipe end-of-file delivery, atomic cancellation visibility, and thread joins also have their documented meaning."
category = "runtime-environment"
owner = "Proofbound Runtime platform maintainer"
rationale = "The source contract can bind one cgroup owner and deadline, retain an exact trace tree with identity-stable handles, order placement, revalidation, termination, exact waits, terminal resource capture, and stream joins, and reject incomplete states, but this repository does not prove kernel event completeness, ptrace stop ownership, procfs or pidfd identity, cgroup effects, clock progress, scheduler fairness, memory ordering, pipe behavior, or standard-library thread effects."
scope = "Only the native interpretation of PBR-OBSERVER-028. It does not establish filesystem object resolution, command progress, production execution, or released-artifact behavior."
affected_claims = ["PBR-OBSERVER-028"]
