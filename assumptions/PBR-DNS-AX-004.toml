schema = "proofbound-assumption/1"
id = "PBR-DNS-AX-004"
statement = "The identified resolver path supplies the DNS response bytes and timing observations attributed to it; DNS data is not trusted for service identity, which remains gated by exact TLS name authentication."
category = "external-provider"
owner = "Proofbound Runtime deployment operator"
rationale = "The connector can bound and record resolver interaction, answer selection, and expiry, but it cannot prove the behavior of a remote resolver or the network carrying its responses. Exact TLS service-name authentication prevents DNS data alone from expanding service authority."
scope = "Only the resolver effects and interpretation of DNS observations used by the proposed PBR-NETWORK-038 connector engine and retained by the proposed PBR-NETWORK-037 receipt contract. It does not establish DNS availability, correctness, confidentiality, DNSSEC validation, or remote-resolver integrity."
affected_claims = ["PBR-NETWORK-037", "PBR-NETWORK-038"]
review_evidence = [
  "docs/specs/0016_authenticated_service_session.md#32-resolution-policy",
  "docs/threat-model.md#trusted-computing-base",
]
discharge_plan = "Retain the identified resolver configuration, bounded response identities, selected endpoint, and TLS authentication result. A future local validating resolver or DNSSEC profile requires a separate claim and evidence wave."
source_citation = "docs/specs/0016_authenticated_service_session.md#9-receipt-and-independent-verification"
status = "active"
