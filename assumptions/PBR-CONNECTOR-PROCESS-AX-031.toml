schema = "proofbound-assumption/1"
id = "PBR-CONNECTOR-PROCESS-AX-031"
statement = "On an identified supported Linux host, procfs descriptor execution, ELF interpreter pathname resolution, Unix socket pairs, close_range, fcntl, poll, signals, wait operations, monotonic clocks, scheduling, and standard-library process and thread operations have the documented behavior used by the connector-process source contract; the deployment also prevents connector, interpreter, runtime-closure, plan, trust-root, and resolver-configuration bytes or path targets from changing between final validation and kernel or connector use."
category = "runtime-environment"
owner = "Proofbound Runtime deployment operator"
rationale = "The source contract can retain descriptors, compare identities, set fixed deadlines, close inherited descriptors, and transfer late reaping to a dedicated thread, but it cannot prove the kernel, loader, clock, scheduler, process library, filesystem stability, or absence of concurrent host mutation. In particular, the kernel resolves PT_INTERP by pathname instead of using the retained closure descriptor."
scope = "Only the native Linux interpretation of PBR-NETWORK-039. It does not establish connector confinement, a malicious-host boundary, exact kernel-loader object binding, scheduler fairness, bounded kernel syscall completion, child release, credentials, receipts, or released-artifact behavior."
affected_claims = ["PBR-NETWORK-039"]
review_evidence = [
  "crates/proofbound-runtime-linux/src/connector_process.rs",
  "crates/proofbound-runtime-linux/src/sys.rs",
  "docs/specs/0016_authenticated_service_session.md",
  "docs/threat-model.md#trusted-computing-base",
]
discharge_plan = "Retain the kernel, loader, clock, scheduler, process-library, and trusted-deployment premises. Narrow them through immutable or measured artifact deployment, native deadline and mutation attacks on each supported architecture, exact loader observations, and release-artifact execution."
source_citation = "docs/specs/0016_authenticated_service_session.md#10-evidence-and-claim-plan"
status = "active"
