name = "proofbound-runtime"
version = "0.1.0"
defaultTargets = ["ProofboundRuntime", "proofbound_lean_audit"]

[[require]]
name = "proofbound"
git = "https://github.com/bordumb/proof-bound"
rev = "504d17df0451975cf051bd0a8a2dc819da502efd"

[[require]]
name = "aeneas"
path = "formal/vendor/aeneas"

[[lean_lib]]
name = "ProofboundRuntime"
srcDir = "formal"

[[lean_lib]]
name = "ProofboundRuntimeGenerated"
srcDir = "formal/generated"
roots = [
  "ProofboundRuntimeBinding.Types",
  "ProofboundRuntimeBinding.Funs",
  "ProofboundRuntimeCore.Types",
  "ProofboundRuntimeCore.Funs",
  "ProofboundRuntimePolicy.Types",
  "ProofboundRuntimePolicy.Funs",
  "ProofboundRuntimeReceipt.Types",
  "ProofboundRuntimeReceipt.Funs",
]

[[lean_lib]]
name = "ProofboundRuntimeBridges"
srcDir = "formal/bridges"
roots = [
  "ProofboundRuntimeCore.FunsExternal",
  "ProofboundRuntimeReceipt.FunsExternal",
]

[[lean_exe]]
name = "proofbound_lean_audit"
root = "ProofboundRuntime.Audit"
srcDir = "formal"
