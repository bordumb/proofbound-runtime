[[invocations.outputs]]
kind = "lean-source"
produced = "Funs.lean"
destination = "formal/generated/ProofboundRuntimePolicy/Funs.lean"

[[invocations.outputs]]
kind = "lean-source"
produced = "Types.lean"
destination = "formal/generated/ProofboundRuntimePolicy/Types.lean"

[[invocations.outputs]]
kind = "translation-report"
produced = "translation.json"
destination = "formal/generated/ProofboundRuntimePolicy/translation.json"

[import_mapping]
mode = "external-source-root"
source_roots = ["formal", "formal/bridges"]

[resource_budget]
time_seconds = 1800
disk_bytes = 26843545600
memory_bytes = 8589934592
