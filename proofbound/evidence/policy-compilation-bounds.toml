schema = "proofbound-evidence-unit/1"
id = "policy-compilation-bounds"
adapter = "kani"
kind = "bounded-check"
claims = ["PBR-POLICY-002"]
tier = 1
expected_inventory = [
  "policy_compilation_does_not_amplify_bounded_catalog",
]
inputs = [
  "crates/proofbound-runtime-core/src/authority.rs",
  "crates/proofbound-runtime-core/src/normalize.rs",
  "crates/proofbound-runtime-core/src/policy.rs",
  "crates/proofbound-runtime-policy-kani/src/lib.rs",
  "proofbound/model-checks/policy-compilation.toml",
]
environment_allowlist = ["CARGO_HOME", "PATH", "RUSTUP_HOME"]

[operation]
type = "kani"
package = "proofbound-runtime-policy-kani"
manifest = "proofbound/model-checks/policy-compilation.toml"
targets = [
  "policy_compilation_does_not_amplify_bounded_catalog",
]

[bounded_domain]
id = "policy-one-path-one-environment-catalog"
description = "All normalized authorities with one path and one environment name over two typed values each; 2^2 finite states."
cardinality = 4
ordering_key = [0, 1]

[resource_budget]
time_seconds = 900
disk_bytes = 2147483648
memory_bytes = 8589934592
