  "sdk/python/pyproject.toml",
  "sdk/typescript/package.json",
  "tools/ci/check_registry_publication.py",
  "tools/ci/test_registry_packages.py",
  "tools/ci/test_release_workflow.py",
  "tools/release/build_sdks.py",
  "tools/release/build_verifier_package.py",
  "tools/release/verify_registry_packages.py",
]
outputs = []
