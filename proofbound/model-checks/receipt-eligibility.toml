schema = "proofbound-model-check-unit/1"
id = "receipt-eligibility-bounds"
adapter = "kani"
package = "proofbound-runtime-receipt-kani"
harnesses = [
  "receipt_eligibility_is_exact_for_bounded_state_model",
]
claims = ["PBR-RECEIPT-004"]
