schema = "proofbound-model-check-unit/1"
id = "receipt-eligibility-bounds"
adapter = "kani"
package = "proofbound-runtime-receipt-kani"
harnesses = [
  "receipt_eligibility_is_exact_for_exit_zero",
  "receipt_eligibility_is_exact_for_exit_nonzero",
  "receipt_eligibility_is_exact_for_signaled",
  "receipt_eligibility_is_exact_for_timed_out",
  "receipt_eligibility_is_exact_for_denied",
  "receipt_eligibility_is_exact_for_launcher_failed",
  "receipt_eligibility_is_exact_for_incomplete",
]
claims = ["PBR-RECEIPT-004"]
solver = "cadical"
unwind = 12
assumptions = [
  "Signal identity does not affect receipt eligibility, so the signaled outcome uses one nonzero representative.",
  "The model covers all 2^32 signed exit-code bit patterns, every other closed outcome class, and every subset of the seven version 2 memory and swap limit events.",
]

[domain]
id = "receipt-eligibility-v2-closed-states"
description = "All boundary, stream-capture, structure, and outcome classes, including every i32 exit code and every subset of seven version 2 memory and swap limit events; 16 * (2^32 + 5) * 128 finite states."
cardinality = 8796093032448
ordering_key = [0, 1, 2, 3, 4, 5]

[resource_budget]
time_seconds = 1800
disk_bytes = 2147483648
memory_bytes = 8589934592
