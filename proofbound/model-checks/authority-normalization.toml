schema = "proofbound-model-check-unit/1"
id = "authority-normalization-bounds"
adapter = "kani"
package = "proofbound-runtime-core"
harnesses = [
  "normalize::kani_harnesses::normalization_does_not_amplify_bounded_catalog",
]
claims = ["PBR-AUTH-001"]
solver = "cadical"
unwind = 5
assumptions = [
  "The plan has exactly two path slots and exactly two environment-name slots.",
  "Each path slot is either the project-input read entry for path b or the output-root write entry for path a.",
  "Each environment-name slot is either LANG or PATH.",
  "The process, wall-time, standard-output, and standard-error limits are fixed to one in their declared units.",
  "The network mode is deny.",
]

[domain]
id = "authority-two-path-two-environment-catalog"
description = "All two-slot path and environment plans over two typed entries per slot; 2^4 finite plans, including duplicate and reversed path cases."
cardinality = 16
ordering_key = [0, 1, 2, 3]

[resource_budget]
time_seconds = 900
disk_bytes = 2147483648
memory_bytes = 8589934592
