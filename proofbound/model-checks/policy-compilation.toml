schema = "proofbound-model-check-unit/1"
id = "policy-compilation-bounds"
adapter = "kani"
package = "proofbound-runtime-policy-kani"
harnesses = [
  "policy_compilation_does_not_amplify_bounded_catalog",
]
claims = ["PBR-POLICY-002"]
solver = "cadical"
unwind = 5
assumptions = [
  "The normalized authority has exactly one path entry and exactly one environment-name entry.",
  "The path entry is either the project-input read entry for path b or the output-root write entry for path a.",
  "The environment-name entry is either LANG or PATH.",
  "The process, wall-time, standard-output, and standard-error limits are fixed to one in their declared units.",
  "The memory limit is selected from 64 KiB and 128 KiB; the swap limit is selected from zero and 64 KiB.",
  "The network mode is deny.",
]

[domain]
id = "policy-one-path-one-environment-catalog"
description = "All normalized authorities with one path, one environment name, one memory limit, and one swap limit over two typed values each; 2^4 finite states."
cardinality = 16
ordering_key = [0, 1]

[resource_budget]
time_seconds = 900
disk_bytes = 2147483648
memory_bytes = 8589934592
