name: Verify

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PBR_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PBR_CI_TIMING_FILE: /tmp/proofbound-runtime-ci-timing.jsonl
    steps:
      - name: Check out the exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PBR_EXACT_SHA }}

      - name: Confirm the exact event head
        run: test "$(git rev-parse HEAD)" = "$PBR_EXACT_SHA"

      - name: Run metadata, documentation, and fixture preflight
        run: >-
          python3 tools/ci/timing.py run
          --output "$PBR_CI_TIMING_FILE"
          --stage preflight
          --kind stage
          --name preflight
          -- bash tools/ci/ci.sh preflight

      - name: Upload preflight timing metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: proofbound-runtime-ci-timing-preflight-${{ env.PBR_EXACT_SHA }}
          path: ${{ env.PBR_CI_TIMING_FILE }}
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Rust and dependencies
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PBR_CI_TIMING_FILE: /tmp/proofbound-runtime-ci-timing.jsonl
    steps:
      - name: Check out the exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PBR_EXACT_SHA }}

      - name: Confirm the exact event head
        run: test "$(git rev-parse HEAD)" = "$PBR_EXACT_SHA"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy,rustfmt

      - name: Install pinned dependency auditor
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Reject Rust lockfile drift
        run: git diff --exit-code -- Cargo.lock

      - name: Run Rust and dependency gates
        run: >-
          python3 tools/ci/timing.py run
          --output "$PBR_CI_TIMING_FILE"
          --stage rust
          --kind stage
          --name rust
          -- bash tools/ci/ci.sh rust

      - name: Upload Rust timing metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: proofbound-runtime-ci-timing-rust-${{ env.PBR_EXACT_SHA }}
          path: ${{ env.PBR_CI_TIMING_FILE }}
          if-no-files-found: error
          retention-days: 14

  formal:
    name: Formal and fresh evidence
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PBR_CI_TIMING_FILE: /tmp/proofbound-runtime-ci-timing.jsonl
    steps:
      - name: Check out the exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PBR_EXACT_SHA }}

      - name: Confirm the exact event head
        run: test "$(git rev-parse HEAD)" = "$PBR_EXACT_SHA"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          mk_all-check: false
          check-reservoir-eligibility: false
          leanchecker: false
          nanoda: false

      - name: Install Nix for pinned translation tools
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Install pinned Charon and Aeneas tools
        env:
          AENEAS_SOURCE_REVISION: 3a8586facab25b31bdb1e1f5f45acd60d1cc5ff0
          AENEAS_VERSION: 3a8586fa
        run: |
          tools_path="$(AENEAS_RELEASE_VERSION="$AENEAS_VERSION" nix build \
            --impure \
            --no-link \
            --print-out-paths \
            "github:AeneasVerif/aeneas/$AENEAS_SOURCE_REVISION#aeneas")"
          echo "$tools_path/bin" >> "$GITHUB_PATH"

      - name: Verify pinned translation tools
        run: |
          test "$(charon version)" = "0.1.225"
          test "$(aeneas -version)" = "aeneas 3a8586fa"

      - name: Install pinned Proofbound tools
        run: >-
          cargo install
          --locked
          --git https://github.com/bordumb/proof-bound
          --rev 70af5e61110fc09704076a6d8b00fd8ff011b1c8
          proofbound-cli
          proofbound-adapter-aeneas
          proofbound-adapter-test
          proofbound-adapter-kani
          proofbound-adapter-lean

      - name: Verify Proofbound executables
        run: |
          command -v proofbound
          command -v proofbound-adapter-aeneas
          command -v proofbound-adapter-test
          command -v proofbound-adapter-kani
          command -v proofbound-adapter-lean

      - name: Install pinned Kani verifier
        run: |
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup

      - name: Fetch locked project dependencies
        run: |
          cargo fetch --locked
          lake update

      - name: Reject bootstrap lockfile drift
        run: git diff --exit-code -- Cargo.lock lake-manifest.json

      - name: Run formal and fresh evidence gates
        run: >-
          python3 tools/ci/timing.py run
          --output "$PBR_CI_TIMING_FILE"
          --stage formal
          --kind stage
          --name formal
          -- bash tools/ci/ci.sh formal

      - name: Upload formal timing metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: proofbound-runtime-ci-timing-formal-${{ env.PBR_EXACT_SHA }}
          path: ${{ env.PBR_CI_TIMING_FILE }}
          if-no-files-found: error
          retention-days: 14

  native:
    name: Native boundary (${{ matrix.architecture }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PBR_CI_TIMING_FILE: /tmp/proofbound-runtime-ci-timing.jsonl
    steps:
      - name: Check out the exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PBR_EXACT_SHA }}

      - name: Confirm the exact event head
        run: test "$(git rev-parse HEAD)" = "$PBR_EXACT_SHA"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Run the required native boundary corpus
        env:
          PROOFBOUND_EXPECTED_ARCH: ${{ matrix.architecture }}
        run: >-
          python3 tools/ci/timing.py run
          --output "$PBR_CI_TIMING_FILE"
          --stage native
          --kind stage
          --name native-boundary
          -- bash tools/ci/native-linux.sh

      - name: Upload native timing metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: proofbound-runtime-ci-timing-native-${{ matrix.architecture }}-${{ env.PBR_EXACT_SHA }}
          path: ${{ env.PBR_CI_TIMING_FILE }}
          if-no-files-found: error
          retention-days: 14

  required:
    name: Current assurance gate
    if: ${{ always() }}
    needs:
      - preflight
      - rust
      - formal
      - native
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject any incomplete or failed required lane
        if: ${{ needs.preflight.result != 'success' || needs.rust.result != 'success' || needs.formal.result != 'success' || needs.native.result != 'success' }}
        run: exit 1

      - name: Admit the exact successful partition
        if: ${{ needs.preflight.result == 'success' && needs.rust.result == 'success' && needs.formal.result == 'success' && needs.native.result == 'success' }}
        run: 'true'
