          experiment_exit=$?
          set -e
          printf '%s\n' "$experiment_exit" >"$result_root/runner.exit"
          exit "$experiment_exit"

      - name: Retain the exact experiment result or runner failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-authority-endpoint-control-${{ matrix.architecture }}-${{ env.EXPERIMENT_SHA }}
          path: ${{ runner.temp }}/network-authority/endpoint-control-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 14

  explicit-broker-control:
    name: explicit broker control (${{ matrix.architecture }})
    env:
      EXPERIMENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out the exact experiment head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPERIMENT_SHA }}

      - name: Confirm the exact experiment head
        run: test "$(git rev-parse HEAD)" = "$EXPERIMENT_SHA"

      - name: Falsify broker and result boundaries
        run: |
          python3 -m unittest \
            experiments.network_authority.test_explicit_broker \
            experiments.network_authority.test_broker_case_client \
            experiments.network_authority.test_record_broker_control

      - name: Run the explicit broker attack corpus
        run: |
          result_root="$RUNNER_TEMP/network-authority/broker-control-${{ matrix.architecture }}"
          mkdir -p "$result_root"
          set +e
          # The runner, not sudo, intentionally owns the failure envelope.
          # shellcheck disable=SC2024
          sudo experiments/network_authority/run_broker_control.sh \
            "$result_root/result" \
