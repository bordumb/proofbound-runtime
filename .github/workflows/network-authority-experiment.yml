name: Network authority experiment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/network-authority-experiment.yml"
      - "experiments/network_authority/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  decision-fixtures:
    name: decision fixtures (${{ matrix.architecture }})
    env:
      EXPERIMENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Check out the exact experiment head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPERIMENT_SHA }}

      - name: Confirm the exact experiment head
        run: test "$(git rev-parse HEAD)" = "$EXPERIMENT_SHA"

      - name: Validate the decision fixtures
        run: |
          python3 -m unittest \
            experiments.network_authority.test_scripted_dns \
            experiments.network_authority.test_decision_http_fixture \
            experiments.network_authority.test_decision_proxy_fixture \
            experiments.network_authority.test_decision_socket_fixture \
            experiments.network_authority.test_routing_transport_case \
            experiments.network_authority.test_routing_child_control \
            experiments.network_authority.test_routing_landlock_control \
            experiments.network_authority.test_routing_endpoint_control \
            experiments.network_authority.test_routing_transport_client \
            experiments.network_authority.test_routing_mediated_client \
            experiments.network_authority.test_routing_mediator \
            experiments.network_authority.test_routing_cell \
            experiments.network_authority.test_run_routing_direct_case \
            experiments.network_authority.test_run_routing_broker_case

      - name: Falsify the native routing boundaries
        run: |
          sudo python3 -m unittest \
            experiments.network_authority.test_routing_child_control \
            experiments.network_authority.test_routing_landlock_control \
            experiments.network_authority.test_routing_endpoint_control

  landlock-port-control:
    name: Landlock port control (${{ matrix.architecture }})
    env:
      EXPERIMENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out the exact experiment head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPERIMENT_SHA }}

      - name: Confirm the exact experiment head
        run: test "$(git rev-parse HEAD)" = "$EXPERIMENT_SHA"

      - name: Falsify result publication
        run: python3 -m unittest experiments.network_authority.test_record_port_control

      - name: Run the disposable Landlock port control
        run: |
          result_root="$RUNNER_TEMP/network-authority/port-control-${{ matrix.architecture }}"
          mkdir -p "$result_root"
          set +e
          # The runner, not sudo, intentionally owns the failure envelope.
          # shellcheck disable=SC2024
          sudo experiments/network_authority/run_port_control.sh \
            "$result_root/result" \
            >"$result_root/runner.stdout" \
            2>"$result_root/runner.stderr"
          experiment_exit=$?
          set -e
          printf '%s\n' "$experiment_exit" >"$result_root/runner.exit"
          exit "$experiment_exit"

      - name: Retain the exact experiment result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-authority-port-control-${{ matrix.architecture }}-${{ env.EXPERIMENT_SHA }}
          path: ${{ runner.temp }}/network-authority/port-control-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 14

  cgroup-bpf-endpoint-control:
    name: cgroup-BPF endpoint control (${{ matrix.architecture }})
    env:
      EXPERIMENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out the exact experiment head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPERIMENT_SHA }}

      - name: Confirm the exact experiment head
        run: test "$(git rev-parse HEAD)" = "$EXPERIMENT_SHA"

      - name: Falsify result publication
        run: |
          python3 -m unittest \
            experiments.network_authority.test_record_endpoint_control

      - name: Run the disposable cgroup-BPF endpoint control
        run: |
          result_root="$RUNNER_TEMP/network-authority/endpoint-control-${{ matrix.architecture }}"
          mkdir -p "$result_root"
          set +e
          # The runner, not sudo, intentionally owns the failure envelope.
          # shellcheck disable=SC2024
          sudo experiments/network_authority/run_endpoint_control.sh \
            "$result_root/result" \
            >"$result_root/runner.stdout" \
