          - mechanism: landlock-port
            architecture: aarch64
            runner: ubuntu-24.04-arm
          - mechanism: cgroup-endpoint
            architecture: x86_64
            runner: ubuntu-24.04
          - mechanism: cgroup-endpoint
            architecture: aarch64
            runner: ubuntu-24.04-arm
          - mechanism: explicit-broker
            architecture: x86_64
            runner: ubuntu-24.04
          - mechanism: explicit-broker
            architecture: aarch64
            runner: ubuntu-24.04-arm
          - mechanism: preconnected-channel
