          path: ${{ runner.temp }}/network-authority/broker-control-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 14

  preconnected-channel-control:
    name: preconnected channel control (${{ matrix.architecture }})
    env:
      EXPERIMENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out the exact experiment head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPERIMENT_SHA }}

      - name: Confirm the exact experiment head
        run: test "$(git rev-parse HEAD)" = "$EXPERIMENT_SHA"

      - name: Falsify channel and result boundaries
        run: |
          python3 -m unittest \
            experiments.network_authority.test_preconnected_channel \
            experiments.network_authority.test_preconnected_case_client \
            experiments.network_authority.test_record_preconnected_control

      - name: Run the preconnected channel attack corpus
        run: |
          result_root="$RUNNER_TEMP/network-authority/preconnected-control-${{ matrix.architecture }}"
          mkdir -p "$result_root"
          set +e
