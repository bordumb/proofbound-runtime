        with:
          ref: ${{ env.EXPERIMENT_SHA }}

      - name: Confirm the exact experiment head
        run: test "$(git rev-parse HEAD)" = "$EXPERIMENT_SHA"

      - name: Run and independently verify the routing transport slice
        run: |
          result_root="$RUNNER_TEMP/network-authority/routing-${{ matrix.mechanism }}-${{ matrix.architecture }}"
          mkdir -p "$result_root"
          set +e
          # The runner, not sudo, intentionally owns the failure envelope.
          # shellcheck disable=SC2024
          sudo experiments/network_authority/run_routing_transport.sh \
            "${{ matrix.mechanism }}" \
            "$result_root/result" \
            >"$result_root/runner.stdout" \
            2>"$result_root/runner.stderr"
          experiment_exit=$?
          set -e
          printf '%s\n' "$experiment_exit" >"$result_root/runner.exit"
          exit "$experiment_exit"

      - name: Retain the exact result or runner failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: network-authority-routing-${{ matrix.mechanism }}-${{ matrix.architecture }}-${{ env.EXPERIMENT_SHA }}
          path: ${{ runner.temp }}/network-authority/routing-${{ matrix.mechanism }}-${{ matrix.architecture }}
