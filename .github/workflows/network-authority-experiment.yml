name: Network authority experiment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/network-authority-experiment.yml"
      - "experiments/network_authority/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  decision-fixtures:
    name: decision fixtures (${{ matrix.architecture }})
    env:
      EXPERIMENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Check out the exact experiment head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPERIMENT_SHA }}

      - name: Confirm the exact experiment head
        run: test "$(git rev-parse HEAD)" = "$EXPERIMENT_SHA"

      - name: Validate the decision fixtures
        run: |
          python3 -m unittest \
            experiments.network_authority.test_record_common \
            experiments.network_authority.test_scripted_dns \
            experiments.network_authority.test_decision_http_fixture \
            experiments.network_authority.test_decision_proxy_fixture \
            experiments.network_authority.test_decision_socket_fixture \
            experiments.network_authority.test_routing_transport_case \
            experiments.network_authority.test_routing_child_control \
            experiments.network_authority.test_routing_landlock_control \
            experiments.network_authority.test_routing_endpoint_control \
            experiments.network_authority.test_routing_transport_client \
            experiments.network_authority.test_routing_mediated_client \
            experiments.network_authority.test_routing_mediator \
            experiments.network_authority.test_routing_cell \
            experiments.network_authority.test_run_routing_direct_case \
            experiments.network_authority.test_run_routing_broker_case \
            experiments.network_authority.test_run_routing_preconnected_case \
            experiments.network_authority.test_record_routing_transport \
            experiments.network_authority.test_run_routing_transport \
            experiments.network_authority.test_verify_routing_transport
          python3 -m unittest \
            experiments.network_authority.test_resolution_indirection_case \
            experiments.network_authority.test_resolution_indirection_client \
            experiments.network_authority.test_resolution_network_client \
            experiments.network_authority.test_resolution_broker \
            experiments.network_authority.test_resolution_cell \
            experiments.network_authority.test_run_resolution_direct_case \
            experiments.network_authority.test_run_resolution_broker_case \
            experiments.network_authority.test_run_resolution_preconnected_case \
            experiments.network_authority.test_record_resolution_indirection \
            experiments.network_authority.test_verify_resolution_indirection \
            experiments.network_authority.test_run_resolution_indirection
          python3 -m unittest \
            experiments.network_authority.test_bypass_lifecycle_case \
            experiments.network_authority.test_bypass_syscall_probe \
            experiments.network_authority.test_bypass_lifecycle_evidence \
            experiments.network_authority.test_bypass_cell \
            experiments.network_authority.test_run_bypass_lifecycle_case \
            experiments.network_authority.test_process_limit_control \
            experiments.network_authority.test_stopped_release_control \
            experiments.network_authority.test_run_bypass_syscall_case \
            experiments.network_authority.test_connection_reuse_fixture \
            experiments.network_authority.test_connection_reuse_channel \
            experiments.network_authority.test_connection_reuse_client \
            experiments.network_authority.test_run_connection_reuse_case \
            experiments.network_authority.test_record_bypass_lifecycle \
            experiments.network_authority.test_verify_bypass_lifecycle \
            experiments.network_authority.test_run_bypass_lifecycle
          python3 -m unittest \
            experiments.network_authority.test_measurement_domain \
            experiments.network_authority.test_measurement_observation \
            experiments.network_authority.test_run_network_measurement \
            experiments.network_authority.test_record_network_measurement \
            experiments.network_authority.test_comparison_domain \
            experiments.network_authority.test_compare_network_results \
            experiments.network_authority.test_verify_network_comparison

      - name: Falsify the native routing boundaries
        run: |
          sudo python3 -m unittest \
            experiments.network_authority.test_routing_child_control \
            experiments.network_authority.test_routing_landlock_control \
            experiments.network_authority.test_routing_endpoint_control \
            experiments.network_authority.test_run_network_measurement.NetworkMeasurementRunnerTests.test_shared_root_allows_dropped_output_but_seals_private_inputs

  measurement-slice:
    name: measurement (${{ matrix.mechanism }}, ${{ matrix.architecture }})
    env:
      EXPERIMENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mechanism: landlock-port
            architecture: x86_64
            runner: ubuntu-24.04
          - mechanism: landlock-port
            architecture: aarch64
            runner: ubuntu-24.04-arm
          - mechanism: cgroup-endpoint
            architecture: x86_64
            runner: ubuntu-24.04
          - mechanism: cgroup-endpoint
            architecture: aarch64
            runner: ubuntu-24.04-arm
          - mechanism: explicit-broker
            architecture: x86_64
            runner: ubuntu-24.04
          - mechanism: explicit-broker
            architecture: aarch64
            runner: ubuntu-24.04-arm
          - mechanism: preconnected-channel
            architecture: x86_64
            runner: ubuntu-24.04
          - mechanism: preconnected-channel
            architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out the exact experiment head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPERIMENT_SHA }}

      - name: Confirm the exact experiment head
        run: test "$(git rev-parse HEAD)" = "$EXPERIMENT_SHA"

      - name: Run and independently verify the measurement slice
        run: |
          result_root="$RUNNER_TEMP/network-authority/measurement-${{ matrix.mechanism }}-${{ matrix.architecture }}"
          mkdir -p "$result_root"
          set +e
          # The runner retains and verifies complete or incomplete result semantics.
          # shellcheck disable=SC2024
          sudo experiments/network_authority/run_network_measurement.sh \
            "${{ matrix.mechanism }}" \
            "$result_root/result" \
            >"$result_root/runner.stdout" \
            2>"$result_root/runner.stderr"
          experiment_exit=$?
          set -e
          printf '%s\n' "$experiment_exit" >"$result_root/runner.exit"
          exit "$experiment_exit"

      - name: Retain the exact measurement or native failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: network-authority-measurement-${{ matrix.mechanism }}-${{ matrix.architecture }}-${{ env.EXPERIMENT_SHA }}
          path: ${{ runner.temp }}/network-authority/measurement-${{ matrix.mechanism }}-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 14

  routing-transport-slice:
    name: routing transport (${{ matrix.mechanism }}, ${{ matrix.architecture }})
    env:
      EXPERIMENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mechanism: landlock-port
            architecture: x86_64
            runner: ubuntu-24.04
          - mechanism: landlock-port
            architecture: aarch64
            runner: ubuntu-24.04-arm
          - mechanism: cgroup-endpoint
            architecture: x86_64
            runner: ubuntu-24.04
          - mechanism: cgroup-endpoint
            architecture: aarch64
            runner: ubuntu-24.04-arm
          - mechanism: explicit-broker
            architecture: x86_64
            runner: ubuntu-24.04
          - mechanism: explicit-broker
            architecture: aarch64
            runner: ubuntu-24.04-arm
          - mechanism: preconnected-channel
            architecture: x86_64
            runner: ubuntu-24.04
          - mechanism: preconnected-channel
            architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out the exact experiment head
