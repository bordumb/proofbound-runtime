name: Native Linux enforcement

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native-boundary:
    name: Native boundary (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out the exact event head
        uses: actions/checkout@v4

      - name: Confirm the exact event head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Run the required native boundary corpus
        env:
          PROOFBOUND_EXPECTED_ARCH: ${{ matrix.architecture }}
        run: bash tools/ci/native-linux.sh
