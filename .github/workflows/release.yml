name: Reproducible release artifacts

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact 40-character commit on main to reproduce
        required: true
        type: string
      publish_packages:
        description: Publish the selected exact packages after protected release approval
        required: true
        default: false
        type: boolean
      bootstrap_npm_package:
        description: Use the one-time protected token route for the first npm publication
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PBR_BOOTSTRAP_NPM_PACKAGE: ${{ inputs.bootstrap_npm_package }}
  PBR_RELEASE_REVISION: ${{ inputs.revision }}
  PBR_PUBLISH_PACKAGES: ${{ inputs.publish_packages }}

jobs:
  validate-revision:
    name: Validate exact mainline revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PBR_RELEASE_REVISION }}
          fetch-depth: 0

      - name: Reject a symbolic or non-mainline revision
        run: |
          [[ "$PBR_RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PBR_RELEASE_REVISION"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$PBR_RELEASE_REVISION" origin/main
          case "$PBR_PUBLISH_PACKAGES:$PBR_BOOTSTRAP_NPM_PACKAGE" in
            true:true|true:false|false:false) ;;
            *)
              echo "npm bootstrap requires package publication" >&2
              exit 2
              ;;
          esac

      - name: Require prepared version and changelog state
        run: python3 tools/release/validate_release_state.py

  sdk-release:
    name: Reproduce SDK release packages
    needs: validate-revision
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact requested head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PBR_RELEASE_REVISION }}
          fetch-depth: 0

      - name: Confirm the exact requested head
        run: test "$(git rev-parse HEAD)" = "$PBR_RELEASE_REVISION"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fef00d40025f7fd8f1ec759cbbb0f577ddfc3133 # 1.94.0

      - name: Populate the locked Cargo dependency cache
        run: cargo fetch --locked

      - name: Build and byte-compare all SDK packages
        run: python3 tools/release/build_sdks.py --output dist/sdk

      - name: Verify the SDK package checksums
        working-directory: dist/sdk
        run: sha256sum --check SHA256SUMS

      - name: Upload the reproduced SDK packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proofbound-runtime-sdk-packages-${{ env.PBR_RELEASE_REVISION }}
          path: dist/sdk/
          if-no-files-found: error

  verifier-package-release:
    name: Reproduce and dogfood the verifier package
    needs: validate-revision
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact requested head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PBR_RELEASE_REVISION }}
          fetch-depth: 0

      - name: Confirm the exact requested head
        run: test "$(git rev-parse HEAD)" = "$PBR_RELEASE_REVISION"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fef00d40025f7fd8f1ec759cbbb0f577ddfc3133 # 1.94.0

      - name: Populate the locked Cargo dependency cache
        run: cargo fetch --locked

      - name: Preflight the closed verifier package
        run: python3 tools/release/build_verifier_package.py --check

      - name: Reproduce and dogfood the exact verifier package
        run: >-
          python3 tools/release/build_verifier_package.py
          --output dist/verifier
          --expected-revision "$PBR_RELEASE_REVISION"

      - name: Verify the verifier package checksum
        working-directory: dist/verifier
        run: sha256sum --check SHA256SUMS

      - name: Independently verify the verifier package manifest
        run: >-
          python3 tools/release/verify_verifier_package_manifest.py
          --manifest dist/verifier/VERIFIER-PACKAGE-MANIFEST.cbor
          --archive "dist/verifier/proofbound-runtime-verify-$(cat VERSION).crate"
          --cddl schemas/verifier-package-manifest-v1.cddl
          --expected-source-revision "$PBR_RELEASE_REVISION"
          --expected-version "$(cat VERSION)"

      - name: Upload the reproduced verifier package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proofbound-runtime-verifier-package-${{ env.PBR_RELEASE_REVISION }}
          path: dist/verifier/
          if-no-files-found: error

  release:
    name: Reproduce and seal release (${{ matrix.architecture }})
    needs: validate-revision
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            context: release-linux-x86-64
            runner: ubuntu-24.04
          - architecture: aarch64
            context: release-linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out the exact requested head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PBR_RELEASE_REVISION }}
          fetch-depth: 0

      - name: Confirm the exact requested head
        run: test "$(git rev-parse HEAD)" = "$PBR_RELEASE_REVISION"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fef00d40025f7fd8f1ec759cbbb0f577ddfc3133 # 1.94.0
        with:
          components: clippy,rustfmt

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          mk_all-check: false
          check-reservoir-eligibility: false
          leanchecker: false
          nanoda: false

      - name: Install Nix for pinned translation tools
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Install pinned Charon and Aeneas tools
        env:
          AENEAS_SOURCE_REVISION: 3a8586facab25b31bdb1e1f5f45acd60d1cc5ff0
          AENEAS_VERSION: 3a8586fa
        run: |
          tools_path="$(AENEAS_RELEASE_VERSION="$AENEAS_VERSION" nix build \
            --impure \
            --no-link \
            --print-out-paths \
            "github:AeneasVerif/aeneas/$AENEAS_SOURCE_REVISION#aeneas")"
          echo "$tools_path/bin" >> "$GITHUB_PATH"

      - name: Verify pinned translation tools
        run: |
          test "$(charon version)" = "0.1.225"
          test "$(aeneas -version)" = "aeneas 3a8586fa"

      - name: Install pinned repository tools
        run: |
          cargo install --locked just --version 1.46.0
          cargo install --locked cargo-deny --version 0.20.2

      - name: Install the exact public Proofbound bundle
        run: >-
          python3 tools/ci/install_proofbound_tool_bundle.py
          --platform linux-${{ matrix.architecture }}
          --destination "$RUNNER_TEMP/proofbound-tools"

      - name: Add the identity-checked public tools to PATH
        run: echo "$RUNNER_TEMP/proofbound-tools" >> "$GITHUB_PATH"

      - name: Verify Proofbound executables
        run: |
          command -v proofbound
          command -v proofbound-verify
          command -v proofbound-adapter-aeneas
          command -v proofbound-adapter-test
          command -v proofbound-adapter-kani
          command -v proofbound-adapter-lean
          command -v proofbound-adapter-node

      - name: Install pinned Kani verifier
        run: |
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup

      - name: Fetch locked project dependencies
        run: just bootstrap

      - name: Reject bootstrap lockfile drift
        run: git diff --exit-code -- Cargo.lock lake-manifest.json

      - name: Install pinned independent CBOR encoder
        run: >-
          python3 -m pip install
          --require-hashes
          --requirement tools/ci/requirements-wire-vectors.txt

      - name: Run the complete repository base gate
        run: just ci

      - name: Build and byte-compare two release bundles
        run: bash tools/release/build-linux.sh dist/runtime

      - name: Verify the published bundle checksum
        working-directory: dist/runtime
        run: sha256sum --check ./*.sha256

      - name: Build and verify the maintained example source bundle
        run: |
          mkdir -p dist/example
          python3 tools/release/build_example.py --output-directory dist/example
          cd dist/example
          sha256sum --check ./*.sha256

      - name: Extract the exact release observation bundle
        run: |
          observation_directory="dist/release-observation/${{ matrix.architecture }}"
          mkdir -p "$observation_directory"
          tar -xzf dist/runtime/*.tar.gz -C "$observation_directory"

      - name: Execute and verify the exact release binaries
        env:
          PROOFBOUND_EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          runtime_directory="$PWD/dist/release-observation/${{ matrix.architecture }}"
          evidence_directory="$PWD/dist/native-evidence/${{ matrix.architecture }}"
          PROOFBOUND_RUNTIME_BIN_DIR="$runtime_directory" \
          PROOFBOUND_EVIDENCE_DIRECTORY="$evidence_directory" \
            bash tools/ci/native-linux.sh

      - name: Create the closed observation input manifest
        run: >-
          python3 tools/release/observation_inputs.py
          --architecture "${{ matrix.architecture }}"
          --output "dist/native-evidence/${{ matrix.architecture }}/proofbound-observation-inputs.json"

      - name: Create and independently observe the contextual release receipt
        env:
          PROOFBOUND_EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          bash tools/release/proofbound-release.sh \
            "${{ matrix.context }}" \
            "dist/native-evidence/${{ matrix.architecture }}/proofbound-observation-inputs.json" \
            "dist/assurance/${{ matrix.architecture }}/proofbound-release"

      - name: Compose the exact contextual release and execution receipts
        run: |
          runtime_directory="$PWD/dist/release-observation/${{ matrix.architecture }}"
          evidence_directory="$PWD/dist/native-evidence/${{ matrix.architecture }}"
          proofbound_release="$PWD/dist/assurance/${{ matrix.architecture }}/proofbound-release"
          commitment="$(tr -d '\n' <"$evidence_directory/receipt-commitment.txt")"
          execution_id="$(tr -d '\n' <"$evidence_directory/execution-id.txt")"
          "$runtime_directory/pbr-compose" \
            --release "$proofbound_release" \
            --proofbound-verifier "$proofbound_release/bin/proofbound-verify" \
            --proofbound-observation-inputs "$evidence_directory/proofbound-observation-inputs.json" \
            --runtime-bundle "$runtime_directory" \
            --execution-receipt "$evidence_directory/execution-receipt.cbor" \
            --execution-commitment "$commitment" \
            --expected-execution-id "$execution_id" \
            --output "$evidence_directory/composed-receipt.cbor" \
            >"$evidence_directory/composition-result.json"
          "$runtime_directory/pbr-compose" inspect \
            "$evidence_directory/composed-receipt.cbor" \
            >"$evidence_directory/composed-receipt.projection.json"

      - name: Confirm the complete observed release chain
        run: |
          python3 - \
            "$PBR_RELEASE_REVISION" \
            "${{ matrix.architecture }}" \
            "${{ matrix.context }}" \
            "dist/assurance/${{ matrix.architecture }}/proofbound-release.verification.json" \
            "dist/native-evidence/${{ matrix.architecture }}/composed-receipt.projection.json" \
            "dist/assurance/${{ matrix.architecture }}/proofbound-release/compiled-receipt.json" \
            "dist/release-observation/${{ matrix.architecture }}/RELEASE-MANIFEST.json" <<'PY'
          import json
          import pathlib
          import sys

          revision, architecture, context = sys.argv[1:4]
          report = json.loads(pathlib.Path(sys.argv[4]).read_bytes())
          receipt = json.loads(pathlib.Path(sys.argv[5]).read_bytes())
          compiled = json.loads(pathlib.Path(sys.argv[6]).read_bytes())
          manifest = json.loads(pathlib.Path(sys.argv[7]).read_bytes())
          assert report["project_revision"] == revision
          assert report["evidence_context"] == context
          assert report["publication_blocked"] is False
          assert report["verdict"] == "bytes-observed"
          assert compiled["schema"] == "proofbound-compiled-release/7"
          assert compiled["project_revision"] == revision
          assert compiled["evidence_context"] == context
          assert receipt["schema"] == "proofbound-runtime-composed-receipt/2"
          assert receipt["eligibility"] == {"status": "composed"}
          assert receipt["release"]["project_revision"] == f"hex:{revision}"
          assert receipt["release"]["evidence_context"] == context
          assert receipt["release"]["verification_verdict"] == "bytes-observed"
          assert receipt["runtime_bundle"]["architecture"] == architecture
          observed = {
              (
                  claim["claim_id"],
                  observation["subject_role"],
                  observation["platform"]["operating_system"],
                  observation["platform"]["architecture"],
              )
              for claim in receipt["claims"]
              for observation in claim["artifact_observations"]
          }
          assert observed == {
              ("PBR-COMPOSE-008", "composer-release", "linux", architecture),
              ("PBR-DIAGNOSTIC-011", "runtime-release", "linux", architecture),
              ("PBR-PREFLIGHT-009", "runtime-release", "linux", architecture),
              ("PBR-RESOURCE-010", "runtime-release", "linux", architecture),
              ("PBR-RUN-007", "runtime-release", "linux", architecture),
              ("PBR-SCAFFOLD-013", "runtime-release", "linux", architecture),
              ("PBR-SEQUENCE-003", "launcher-release", "linux", architecture),
              ("PBR-VERIFY-006", "verifier-release", "linux", architecture),
          }
          pbr = next(item for item in manifest["artifacts"] if item["name"] == "pbr")
          bindings = []
          for wrapper in compiled["evidence"]:
              record = wrapper["record"]
              binding = record.get("artifact_binding")
              if binding is None:
                  continue
              assert record["schema"] == "proofbound-evidence/5"
              assert record["kind"] == "artifact-soundness"
              assert record["outcome"] == "passed"
              assert record["evaluation_mode"] == "kernel"
              assert record["binding_mode"] == "digest-theorem"
              assert record["evidence_context"] == context
              assert len(record["claim_ids"]) == 1
              assert binding["theorem_evidence"].startswith("sha256:")
              assert binding["artifact"] == {
                  "logical_name": f"dist/release-observation/{architecture}/pbr",
                  "sha256": f"sha256:{pbr['sha256']}",
                  "size_bytes": pbr["size"],
              }
              bindings.append(record["claim_ids"][0])
          assert sorted(bindings) == [
              "PBR-AUTH-001",
              "PBR-BINDING-005",
              "PBR-POLICY-002",
              "PBR-RECEIPT-004",
          ]
          tier3 = {
              claim["claim_id"]: claim
              for claim in receipt["claims"]
              if claim["claim_id"] in bindings
          }
          assert set(tier3) == set(bindings)
          for claim in tier3.values():
              assert claim["formal"] == "PROVED"
              assert claim["linkage"] == "REFINED"
              assert claim["assumption"] == "ASSUMED"
          PY

      - name: Upload the reproduced and observed release chain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proofbound-runtime-${{ matrix.architecture }}
          path: |
            dist/assurance/${{ matrix.architecture }}/
            dist/example/
            dist/native-evidence/${{ matrix.architecture }}/
            dist/release-observation/${{ matrix.architecture }}/
            dist/runtime/
          if-no-files-found: error

  provenance:
    name: Seal aggregate release provenance
    needs: [sdk-release, verifier-package-release, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact requested head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PBR_RELEASE_REVISION }}

      - name: Confirm the exact requested head
        run: test "$(git rev-parse HEAD)" = "$PBR_RELEASE_REVISION"

      - name: Download the reproduced SDK packages
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: proofbound-runtime-sdk-packages-${{ env.PBR_RELEASE_REVISION }}
          path: dist/provenance-inputs/sdk

      - name: Download the reproduced verifier package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: proofbound-runtime-verifier-package-${{ env.PBR_RELEASE_REVISION }}
          path: dist/provenance-inputs/verifier

      - name: Download the x86-64 release chain
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: proofbound-runtime-x86_64
          path: dist/provenance-inputs/x86_64

      - name: Download the AArch64 release chain
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: proofbound-runtime-aarch64
          path: dist/provenance-inputs/aarch64

      - name: Build and independently verify the closed provenance object
        run: |
          mkdir -p dist/provenance
          python3 tools/release/build_provenance.py \
            --revision "$PBR_RELEASE_REVISION" \
            --artifact-root sdk=dist/provenance-inputs/sdk \
            --artifact-root verifier=dist/provenance-inputs/verifier \
            --artifact-root x86_64=dist/provenance-inputs/x86_64 \
            --artifact-root aarch64=dist/provenance-inputs/aarch64 \
            --output dist/provenance/release-provenance.cbor
          python3 tools/release/verify_provenance.py \
            --provenance dist/provenance/release-provenance.cbor \
            --expected-revision "$PBR_RELEASE_REVISION" \
            --artifact-root sdk=dist/provenance-inputs/sdk \
            --artifact-root verifier=dist/provenance-inputs/verifier \
            --artifact-root x86_64=dist/provenance-inputs/x86_64 \
            --artifact-root aarch64=dist/provenance-inputs/aarch64 \
            --projection dist/provenance/release-provenance.projection.json

      - name: Upload the aggregate release provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proofbound-runtime-release-provenance-${{ env.PBR_RELEASE_REVISION }}
          path: dist/provenance/
          if-no-files-found: error

  publish-verifier-crate:
    name: Publish the independent verifier crate
    if: ${{ inputs.publish_packages == true }}
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: package-publish
    permissions:
      contents: read
    steps:
      - name: Check out the exact approved mainline revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PBR_RELEASE_REVISION }}
          persist-credentials: false
          fetch-depth: 0

      - name: Confirm the exact approved source
        run: test "$(git rev-parse HEAD)" = "$PBR_RELEASE_REVISION"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fef00d40025f7fd8f1ec759cbbb0f577ddfc3133 # 1.94.0

      - name: Download the approved verifier package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: proofbound-runtime-verifier-package-${{ env.PBR_RELEASE_REVISION }}
          path: dist/verifier

      - name: Reproduce the upload input from the exact source
        run: |
          cargo fetch --locked
          cargo package --locked --no-verify \
            --package proofbound-runtime-verify \
            --registry crates-io \
            --target-dir target/publish-verifier
          cmp \
            "target/publish-verifier/package/proofbound-runtime-verify-$(cat VERSION).crate" \
            "dist/verifier/proofbound-runtime-verify-$(cat VERSION).crate"

      - name: Publish the independently verified package
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "${CARGO_REGISTRY_TOKEN:-}"
          cargo publish --locked --no-verify \
            --package proofbound-runtime-verify \
            --registry crates-io

  publish-rust-sdk:
    name: Publish the Rust SDK crate
    if: ${{ inputs.publish_packages == true }}
    needs: publish-verifier-crate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: package-publish
    permissions:
      contents: read
    steps:
      - name: Check out the exact approved mainline revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PBR_RELEASE_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the exact approved source
        run: test "$(git rev-parse HEAD)" = "$PBR_RELEASE_REVISION"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fef00d40025f7fd8f1ec759cbbb0f577ddfc3133 # 1.94.0

      - name: Download the approved SDK packages
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: proofbound-runtime-sdk-packages-${{ env.PBR_RELEASE_REVISION }}
          path: dist/sdk

      - name: Reproduce the upload input from the exact source
        run: |
          cargo fetch --locked
          cargo package --locked --no-verify \
            --package proofbound-runtime-sdk \
            --registry crates-io \
            --target-dir target/publish-sdk
          cmp \
            "target/publish-sdk/package/proofbound-runtime-sdk-$(cat VERSION).crate" \
            "dist/sdk/proofbound-runtime-sdk-$(cat VERSION).crate"

      - name: Publish the reproduced Rust SDK
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "${CARGO_REGISTRY_TOKEN:-}"
          cargo publish --locked --no-verify \
            --package proofbound-runtime-sdk \
            --registry crates-io

  publish-python-sdk:
    name: Publish the Python SDK wheel
    if: ${{ inputs.publish_packages == true }}
    needs: publish-rust-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: package-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the exact reproduced SDK packages
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: proofbound-runtime-sdk-packages-${{ env.PBR_RELEASE_REVISION }}
          path: dist/sdk

      - name: Isolate the approved wheel
        run: |
          mkdir -p dist/python
          cp dist/sdk/proofbound_runtime_sdk-*-py3-none-any.whl dist/python/
          test "$(find dist/python -type f | wc -l)" = 1

      - name: Publish through the configured PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/python

  publish-typescript-sdk:
    name: Publish the TypeScript SDK package
    if: ${{ inputs.publish_packages == true }}
    needs: publish-python-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: package-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the exact reproduced SDK packages
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: proofbound-runtime-sdk-packages-${{ env.PBR_RELEASE_REVISION }}
          path: dist/sdk

      - name: Install the admitted Node and npm clients
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.8.0"
          package-manager-cache: false

      - name: Confirm the selected npm authentication route
        env:
          PBR_NPM_PACKAGE: "@proofbound/runtime-sdk"
        run: |
          npm install --global npm@11.6.0
          test "$(npm --version)" = 11.6.0
          node --input-type=module <<'NODE'
          const mode = process.env.PBR_BOOTSTRAP_NPM_PACKAGE;
          if (mode !== "true" && mode !== "false") {
            throw new Error("npm bootstrap input is not Boolean");
          }
          const packageName = process.env.PBR_NPM_PACKAGE;
          if (packageName !== "@proofbound/runtime-sdk") {
            throw new Error("npm package identity is not admitted");
          }
          const response = await fetch(
            `https://registry.npmjs.org/${encodeURIComponent(packageName)}`,
            {
              headers: {accept: "application/json"},
              redirect: "error",
              signal: AbortSignal.timeout(30_000),
            },
          );
          const expected = mode === "true" ? 404 : 200;
          if (response.status !== expected) {
            throw new Error(
              `npm package state is ${response.status}; expected ${expected}`,
            );
          }
          await response.body?.cancel();
          NODE

      - name: Bootstrap the missing npm package once
        if: ${{ inputs.bootstrap_npm_package == true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_INITIAL_PUBLISH_TOKEN }}
        run: |
          test -n "${NODE_AUTH_TOKEN:-}"
          npm_config="$RUNNER_TEMP/npm-bootstrap.npmrc"
          trap 'rm -f "$npm_config"' EXIT
          # Keep the token out of the file. npm expands this placeholder.
          # shellcheck disable=SC2016
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' >"$npm_config"
          NPM_CONFIG_USERCONFIG="$npm_config" npm publish \
            dist/sdk/proofbound-runtime-sdk-*.tgz \
            --access public \
            --ignore-scripts \
            --provenance \
            --registry https://registry.npmjs.org

      - name: Publish through the configured npm trusted publisher
        if: ${{ inputs.bootstrap_npm_package != true }}
        run: |
          npm publish dist/sdk/proofbound-runtime-sdk-*.tgz \
            --access public \
            --ignore-scripts \
            --provenance \
            --registry https://registry.npmjs.org

  observe-registry-packages:
    name: Retrieve and compare all registry packages
    if: ${{ inputs.publish_packages == true }}
    needs: [provenance, publish-typescript-sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the exact approved mainline revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PBR_RELEASE_REVISION }}
          persist-credentials: false

      - name: Confirm the exact approved source
        run: test "$(git rev-parse HEAD)" = "$PBR_RELEASE_REVISION"

      - name: Download the approved SDK packages
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: proofbound-runtime-sdk-packages-${{ env.PBR_RELEASE_REVISION }}
          path: dist/sdk

      - name: Download the approved verifier package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: proofbound-runtime-verifier-package-${{ env.PBR_RELEASE_REVISION }}
          path: dist/verifier

      - name: Download the approved x86-64 release chain
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: proofbound-runtime-x86_64
          path: dist/current-integration-inputs/x86_64

      - name: Download the approved AArch64 release chain
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: proofbound-runtime-aarch64
          path: dist/current-integration-inputs/aarch64

      - name: Anonymously retrieve and compare exact registry bytes
        run: >-
          python3 tools/release/verify_registry_packages.py
          --sdk-directory dist/sdk
          --verifier-directory dist/verifier
          --expected-revision "$PBR_RELEASE_REVISION"
          --output dist/registry/registry-observations.json

      - name: Build and independently verify the current integration tuple
        run: |
          version="$(cat VERSION)"
          mkdir -p dist/current-integration
          python3 tools/release/build_current_integration.py \
            --revision "$PBR_RELEASE_REVISION" \
            --registry-observations dist/registry/registry-observations.json \
            --runtime-artifact "aarch64:runtime-bundle=dist/current-integration-inputs/aarch64/runtime/proofbound-runtime-v${version}-aarch64-unknown-linux-gnu.tar.gz" \
            --runtime-artifact "aarch64:acceptor=dist/current-integration-inputs/aarch64/runtime/pbr-accept-v${version}-aarch64-unknown-linux-gnu" \
            --runtime-artifact "x86_64:runtime-bundle=dist/current-integration-inputs/x86_64/runtime/proofbound-runtime-v${version}-x86_64-unknown-linux-gnu.tar.gz" \
            --runtime-artifact "x86_64:acceptor=dist/current-integration-inputs/x86_64/runtime/pbr-accept-v${version}-x86_64-unknown-linux-gnu" \
            --proofbound-pin proofbound/toolchains/proofbound-tool-bundle-pin.json \
            --output dist/current-integration/current-integration.cbor
          python3 tools/release/verify_current_integration.py \
            --record dist/current-integration/current-integration.cbor \
            --expected-revision "$PBR_RELEASE_REVISION" \
            --registry-observations dist/registry/registry-observations.json \
            --runtime-artifact "aarch64:runtime-bundle=dist/current-integration-inputs/aarch64/runtime/proofbound-runtime-v${version}-aarch64-unknown-linux-gnu.tar.gz" \
            --runtime-artifact "aarch64:acceptor=dist/current-integration-inputs/aarch64/runtime/pbr-accept-v${version}-aarch64-unknown-linux-gnu" \
            --runtime-artifact "x86_64:runtime-bundle=dist/current-integration-inputs/x86_64/runtime/proofbound-runtime-v${version}-x86_64-unknown-linux-gnu.tar.gz" \
            --runtime-artifact "x86_64:acceptor=dist/current-integration-inputs/x86_64/runtime/pbr-accept-v${version}-x86_64-unknown-linux-gnu" \
            --proofbound-pin proofbound/toolchains/proofbound-tool-bundle-pin.json \
            --projection dist/current-integration/current-integration.projection.json \
            --rendering dist/current-integration/CURRENT-INTEGRATION.md

      - name: Upload the registry observations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proofbound-runtime-registry-observations-${{ env.PBR_RELEASE_REVISION }}
          path: dist/registry/
          if-no-files-found: error

      - name: Upload the exact current integration tuple
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proofbound-runtime-current-integration-${{ env.PBR_RELEASE_REVISION }}
          path: dist/current-integration/
          if-no-files-found: error
