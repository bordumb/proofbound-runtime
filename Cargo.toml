[workspace]
resolver = "2"
members = [
  "crates/proofbound-runtime-accept",
  "crates/proofbound-runtime-binding",
  "crates/proofbound-runtime-core",
  "crates/proofbound-runtime-cli",
  "crates/proofbound-runtime-compose",
  "crates/proofbound-runtime-linux",
  "crates/proofbound-runtime-bench",
  "crates/proofbound-runtime-policy-kani",
  "crates/proofbound-runtime-receipt",
  "crates/proofbound-runtime-receipt-kani",
  "crates/proofbound-runtime-sdk",
  "crates/proofbound-runtime-verify",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bordumb/proofbound-runtime"
rust-version = "1.93"
publish = false

[workspace.dependencies]
libc = "=0.2.189"
proofbound-runtime-binding = { path = "crates/proofbound-runtime-binding" }
proofbound-runtime-accept = { path = "crates/proofbound-runtime-accept" }
proofbound-runtime-compose = { path = "crates/proofbound-runtime-compose" }
proofbound-runtime-core = { path = "crates/proofbound-runtime-core" }
proofbound-runtime-linux = { path = "crates/proofbound-runtime-linux" }
proofbound-runtime-verify = { path = "crates/proofbound-runtime-verify" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
toml = "=1.1.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
