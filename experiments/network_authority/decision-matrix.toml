schema = "proofbound-runtime-network-decision-matrix/1"
architectures = ["x86_64", "aarch64"]
outcomes = ["allowed", "denied", "exposes-limitation", "unsupported-before-launch"]
stages = ["plan", "prelaunch", "child-boundary", "resolver", "routing", "tls", "application-protocol", "lifecycle", "cleanup"]
slices = ["routing-transport", "resolution-indirection", "bypass-lifecycle"]
fixtures = ["dual-stack-tls", "scripted-dns", "redirect-service", "proxy-service", "socket-bypass", "lifecycle", "publication"]
attempted_authorities = ["service-session", "routing-endpoint", "resolver-policy", "application-operation", "child-network", "local-socket", "inherited-socket", "kernel-async", "process-tree", "boundary-lifecycle", "subject-identity", "connection-count", "result-publication"]
parent_rows = [
  "exact-service",
  "undeclared-service-443",
  "literal-ip",
  "wrong-certificate",
  "dns-answer-change",
  "cname-allowed",
  "cname-undeclared",
  "redirect",
  "proxy-tunnel",
  "ambient-overrides",
  "direct-tcp-other-port",
  "direct-udp",
  "bind-listen",
  "unix-sockets",
  "inherited-internet-socket",
  "io-uring",
  "address-encodings",
  "resolver-failures",
  "broker-connector-crash",
  "subject-substitution",
  "process-tree",
  "install-race",
  "cleanup-failure",
  "result-replacement",
]

[[mechanisms]]
id = "landlock-port"
service_identity_enforcement = "untrusted-child"
may_enter_adr_comparison = false

[[mechanisms]]
id = "cgroup-endpoint"
service_identity_enforcement = "untrusted-child"
may_enter_adr_comparison = false

[[mechanisms]]
id = "explicit-broker"
service_identity_enforcement = "trusted-mediator"
may_enter_adr_comparison = true

[[mechanisms]]
id = "preconnected-channel"
service_identity_enforcement = "trusted-mediator"
may_enter_adr_comparison = true

