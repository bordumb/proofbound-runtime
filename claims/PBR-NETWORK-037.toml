schema = "proofbound-claim/1"
id = "PBR-NETWORK-037"
title = "Service-session receipts close reusable success and typed failure"
statement = "The proposed service-session receipt contract binds one expected execution, plan, compiled policy, service, assumptions, and trusted-computing-base inventory; it binds the exact retained launcher prefix only after launcher start, reusable success additionally binds the exact installed acknowledgement, release, canonical successful observation, and zero child exit, while every typed failed session is non-reusable and preserves a phase-consistent reason, boundary and release state, and cleanup result; an independent checker rejects registered omission, substitution, downgrade, cross-service, premature-launcher, premature-release, cleanup, secret-retention, and nested-observation mutations."
public_language = "Runtime has a proposed deterministic-CBOR service-session receipt fragment with independently checked reusable-success and non-reusable-failure forms. The frozen vectors bind exact execution context, phase-appropriate retained launcher identities, assumptions, trusted-computing-base identities, observation, outcome, failure, and cleanup fields without retaining secrets or application content. This is source contract evidence only. The production receipt producer and shipping verifier do not accept this fragment, and it does not establish network enforcement."
subject = "schema:proofbound-runtime-service-session-receipt/1+python:service_receipt_contract.validate_receipt"
profile = "ledger"
tier = 1
evidence = [
  "independent-check:authenticated-service-receipt-contract",
]
assumptions = [
  "PBR-DNS-AX-004",
  "PBR-TLS-AX-005",
]
open_obligations = [
  "Integrate the fragment into the production receipt producer and a separately implemented Rust verifier without sharing semantic implementation code.",
  "Define and admit generic composition and explicit consumer acceptance for service-session receipts without losing authority, failure, assumption, or trusted-computing-base fields.",
  "Bind effectful connector, launcher, child-boundary, cleanup, and receipt observations to exact release artifacts on both supported architectures.",
]
out_of_scope = [
  "Any claim that the proposed receipt was produced by an execution, accepted by the shipping verifier, composed, or accepted by a consumer policy.",
  "Correctness of DNS, TLS, the connector, Linux, the launcher, a remote service, a credential source, or recorded observations.",
  "Ambient networking, arbitrary protocols, multiple services, reconnect, redirects, proxies, or QUIC.",
]
