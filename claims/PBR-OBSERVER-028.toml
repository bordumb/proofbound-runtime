schema = "proofbound-claim/1"
id = "PBR-OBSERVER-028"
title = "Diagnostic execution owns one bounded resource lifecycle"
statement = "For the aggregate separate Linux diagnostic cgroup, trace, raw-operation, and adapter source path, preparation accepts only a fresh cgroup version 2 boundary whose identity and exact process, memory, swap, and OOM-group control readbacks match the install request and resource limits; zero resource observations, empty membership, and unpopulated state are revalidated during preparation and immediately before child spawn, while controls are also revalidated immediately before target release; one absolute monotonic execution deadline starts immediately before child spawn, remains private across setup, target release, active observation, and natural terminal collection, wins over late-ready stops and events, and is checked immediately before target release or resume; the spawned child is placed in and read back from the exact cgroup before the spawned trace state is returned; timeout or observation failure creates one fixed absolute cleanup deadline, successfully signals every retained process group through identity-stable handles, and carries that same deadline through exact waits, cgroup drain and removal, resource observation, stream cancellation, and joins; and a complete or incomplete diagnostic publication decision is available only after the exact trace tree is terminal, cgroup drain and removal succeed, complete version 2 resource observations are retained, and both bounded streams join before the applicable deadline. A pre-used cgroup, cgroup mismatch, control drift, placement failure, late stop or event, signal failure, cleanup failure, incomplete resource observation, stream failure, or deadline expiry returns a closed error and prevents publication."
public_language = "The separate diagnostic trace has source-level coupling for one exact fresh cgroup version 2 boundary, freshness and control revalidation before spawn, control revalidation before release, one private absolute execution deadline with late-event rejection, exact-child placement before trace startup completes, and one absolute forced-cleanup deadline shared by process waits, cgroup cleanup, resource capture, stream cancellation, and joins. Explicit signal failure and every incomplete terminal state prevent publication. Registered Rust type and adapter compile checks plus an independent exact-source checker cover this lifecycle and its fail-closed order. They do not prove kernel, clock, cgroup, ptrace, scheduler, pipe, command, or released-artifact behavior."
subject = "rust:proofbound_runtime_linux::cgroup+proofbound_runtime_linux::trace+proofbound_runtime_linux::sys+proofbound_runtime_diagnose_linux::adapter"
profile = "ledger"
tier = 1
evidence = [
