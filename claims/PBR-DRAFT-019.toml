schema = "proofbound-claim/1"
id = "PBR-DRAFT-019"
title = "Diagnostic artifact construction cannot grant plan authority"
statement = "For validated bounded diagnostic observations, the pure diagnostic artifact producer streams canonical non-reusable diagnostic receipt bytes and a plan draft within the declared output bound; suggestions stay within explicit normalized candidate roots, exclude system, home, and temporary roots, retain exact provenance, keep network and unresolved observations open, require exact Capsec schema, source, analyzer, and report identities, and leave write roots, environment names, resource limits, and network mode as mandatory human choices."
public_language = "Runtime has one pure aggregate producer for closed diagnostic receipt and plan-draft objects. Registered tests cover bounded streaming canonical encoding, exact-capacity and overflow gap semantics, ordering, required stable-path evidence, redaction, normalized scoped paths, exact Capsec identity usability, mandatory human choices, network non-grant, unresolved observations, and provenance retention. This is bounded source evidence. It does not establish ptrace coverage, kernel correctness, plan safety, or production receipt reuse."
