schema = "proofbound-claim/1"
id = "PBR-NETWORK-043"
title = "The child has no network path except the transferred egress listener"
statement = "For a supported declared-egress execution, the launcher enters a new user namespace with a non-root identity map and a new network namespace with only loopback and loopback routes, transfers its one 127.0.0.1:3128 listener to the supervisor before boundary installation, and installs the egress-child seccomp filter and Landlock network, pathname Unix-socket, and scope rules before child release, so that the child and its descendants cannot reach any network destination, host Unix socket, or host process except through connections accepted by the identified egress proxy on that listener."
public_language = "Registered at Tier 0 only. Specification 0017 defines the namespace setup, listener transfer, child filter, Landlock rules, and bypass corpus. No launcher implementation or native evidence exists yet. Tests are never proofs; the planned native corpus is bounded enforcement evidence."
subject = "rust:proofbound_runtime_linux::egress_namespace::{enter_egress_namespace,transfer_egress_listener,install_egress_child_boundary}"
profile = "ledger"
tier = 0
evidence = []
