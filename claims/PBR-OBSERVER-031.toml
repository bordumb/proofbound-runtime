schema = "proofbound-claim/1"
id = "PBR-OBSERVER-031"
title = "The separate diagnostic command publishes only non-reusable artifacts"
statement = "The separate pbr-diagnose executable strictly parses one seed execution plan, normalizes and installs only that plan's production Landlock, seccomp, cgroup, descriptor, environment-name, executable, and resource authority, requires an explicit delegated cgroup root and absent receipt and draft targets outside child write authority, drives the coupled bounded observer through terminal cleanup, converts complete stopped-tracee events into one diagnostic receipt and derived plan draft, and publishes both artifacts with create-new staging, durable file writes, no-replace links, cleanup, and parent-directory sync only after terminal publication eligibility. The receipt identifies the diagnostic profile and is non-reusable; the draft is not a policy; production pbr and pbr-native-launcher do not depend on the diagnostic crates; and the exact pbr-diagnose executable is included in the closed release inventory and native observation inputs."
public_language = "The source contains a separate pbr-diagnose command. It reuses a validated seed plan without adding authority, runs the bounded diagnostic observer, and publishes a non-reusable receipt plus a human-review draft only after terminal cleanup. The production executables remain free of the observer dependency. Registered tests and an independent source check cover the command and release-inventory construction. Native exact-head and released-artifact behavior remain open obligations."
subject = "rust:proofbound_runtime_diagnose_cli+release:pbr-diagnose"
profile = "ledger"
tier = 1
