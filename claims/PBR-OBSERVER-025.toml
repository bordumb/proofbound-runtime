]
open_obligations = [
  "Run the complete source, compilation, unit, and independent-check evidence in hosted exact-head verification before merge.",
  "Falsify every registered syscall family, limit, malformed pointer, partial read, page boundary, x32 form, and structure-size case on both supported native architectures.",
  "Resolve successful filesystem results to kernel-selected identities while the tracee remains stopped.",
  "Couple the separate PBR-OBSERVER-026 artifact mapper to command publication without weakening its fail-closed error path.",
  "Bind the exact released diagnostic executable and observer mechanism identity before describing this decoder as released.",
]
out_of_scope = [
  "Correctness or completeness of Linux ptrace, PTRACE_GET_SYSCALL_INFO, process_vm_readv, the registered syscall tables, or tracee memory.",
  "Equality between tracer-read bytes and bytes later consumed by the kernel when another tracee thread can mutate shared memory.",
  "Filesystem or socket object resolution, capability inference, automatic authority generation, production execution, or production receipt meaning.",
]
