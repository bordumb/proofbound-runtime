schema = "proofbound-claim/1"
id = "PBR-OBSERVER-025"
title = "Diagnostic syscall decoding is architecture-qualified and operand-bounded"
statement = "For the separate Linux diagnostic observer's aggregate pure-bound, adapter, trace, and raw-read source path, each PTRACE_GET_SYSCALL_INFO entry is decoded through one closed x86_64 or aarch64 syscall-number table before the stopped tracee resumes; only the filesystem, socket, process-creation, and execution families registered by Specification 0015 produce retained syscall events; openat2 and clone3 accept only registered ABI structure sizes; path strings are read without silent truncation under independent tracee-string and retained-path byte limits; socket-address reads use their independent byte limit; process_vm_readv is confined to the raw syscall module and completes each bounded read or returns a typed failure; sendto retains its payload length but never reads payload bytes; and an unknown architecture, x32 form, unsupported registered form, tracee-memory failure, or operand-bound exhaustion returns a closed error that the coupled adapter converts irreversibly into diagnostic drain instead of producing an observation."
public_language = "The separate Linux diagnostic observer has a bounded source-level decoder for the registered x86_64 and aarch64 syscall families. It captures path and socket-address operands while the tracee is stopped at entry, enforces independently derived string, path, and socket-address limits without silent truncation, and never reads request or response payload bytes. Unknown architectures, unsupported ABI forms, read failures, and bound exhaustion fail closed into diagnostic drain. Registered Rust compile/tests and independent exact-source checkers cover the aggregate bound, adapter, decoder, ordering, limit, read-only syscall, and payload-exclusion path. They do not prove the Linux ABI, event completeness, tracee-memory stability, kernel-selected object identity, or a complete diagnostic execution."
subject = "rust:proofbound_runtime_linux::trace+proofbound_runtime_linux::sys::trace_read_process_memory+proofbound_runtime_diagnose::observer+proofbound_runtime_diagnose_linux::adapter"
profile = "ledger"
tier = 1
evidence = [
  "example-test:diagnostic-trace-startup",
  "example-test:diagnostic-syscall-decoder-adapter",
  "independent-check:diagnostic-observer-adapter-contract",
  "independent-check:diagnostic-syscall-decoder-contract",
]
