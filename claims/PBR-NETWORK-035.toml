  "Bind effectful connector, launcher, child-boundary, and cleanup observations to exact release artifacts on both supported architectures.",
  "Add failed-session and non-reusable receipt forms before any effectful service-session execution can publish a receipt.",
]
out_of_scope = [
  "Any claim that the proposed observation was produced by an execution or independently verified by the shipping verifier.",
