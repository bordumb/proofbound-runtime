schema = "proofbound-claim/1"
id = "PBR-NETWORK-035"
title = "Service-session observations are complete, bounded, and content-free"
statement = "The proposed service-session observation contract records one exact service, policy, connector closure, bounded DNS result and ordered endpoint attempts, authenticated TLS identity, registered local channel, byte counters, complete forward lifecycle, terminal cleanup, and credential-source identity while excluding credential values and application content; an independent checker rejects registered omission, substitution, expiry, limit, lifecycle, cleanup, cross-service, and retained-content mutations."
public_language = "Runtime has a proposed closed deterministic-CBOR service-session observation fragment and an independent semantic checker. The frozen vector binds one service, selected endpoint, exact TLS identity result, connector, channel, bounded counters, lifecycle, cleanup, and credential-source name without retaining secrets or application bytes. This is source contract evidence only. It is not yet integrated into a production receipt or verifier and does not establish network enforcement."
subject = "schema:proofbound-runtime-service-session-observation/1+python:service_observation_contract.validate_observation"
profile = "ledger"
tier = 1
evidence = [
  "independent-check:authenticated-service-observation-contract",
]
assumptions = []
