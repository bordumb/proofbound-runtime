schema = "proofbound-claim/1"
id = "PBR-SCAFFOLD-013"
title = "Plan scaffolding inventories a bounded static ELF closure"
statement = "For a supported explicit Linux ELF64 host profile, pbr plan scaffold reads but never executes one exact target, strictly parses its interpreter and transitive DT_NEEDED metadata, records deterministic ordered resolution provenance and artifact identities, and emits a non-policy diagnostic with every mandatory human choice and unresolved dynamic-load class open."
public_language = "The development scaffold inventories the registered bounded static ELF cases without executing target code and labels its JSON output as unsafe and incomplete. This is source-level test evidence, not a safe policy, a complete account of runtime loads, or exact released-artifact evidence."
subject = "rust:proofbound_runtime_cli::scaffold::execute"
profile = "ledger"
tier = 0
evidence = ["example-test:plan-scaffold-attacks"]
assumptions = [
  "PBR-HOST-AX-002",
  "PBR-TOOLCHAIN-AX-003",
]
