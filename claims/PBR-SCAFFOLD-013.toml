  "Execute the scaffold corpus on both supported native architectures at the next release head.",
  "Bind exact native pbr artifacts containing plan scaffold before describing the command as released.",
  "Retain human review of write roots, environment names, limits, network mode, plugins, configuration, and other dynamic loads for every derived plan.",
]
out_of_scope = [
  "Proof that the scaffold is a safe or complete execution policy.",
  "Discovery of arbitrary plugin, dynamic-language, configuration, environment-dependent, or target-computed loads.",
  "Proof that an observed path or artifact identity remains unchanged after scaffolding returns.",
