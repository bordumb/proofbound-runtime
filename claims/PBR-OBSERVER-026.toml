schema = "proofbound-claim/1"
id = "PBR-OBSERVER-026"
title = "Diagnostic trace events map without inventing resolution"
statement = "For the separate Linux diagnostic event-mapping source API, each complete registered syscall event maps its exact process identity, closed audit architecture, syscall class, bounded entry operands, and consistent nonnegative result or positive Linux error into one diagnostic artifact event; an exec image replacement maps only when it retains a matching execve or execveat entry; mapped events receive contiguous sequence values; lifecycle-only events create no syscall record; an event without a retained selected object remains unresolved, while an event with one can become kernel-selected only when its retained path is valid UTF-8, normalized, absolute, non-deleted, and accompanied by a complete object identity; the mapper never creates a stable candidate; socket payload bytes are never introduced; and an unknown architecture, inconsistent result marker, invalid exec invocation, non-UTF-8 supplied path, artifact inconsistency, or sequence overflow returns a closed error instead of publishing a weakened event."
public_language = "The separate Linux diagnostic observer has a source-level mapping from complete trace events to non-reusable diagnostic artifact events. The mapping preserves process, architecture, syscall class, bounded entry operands, and outcome, assigns contiguous event sequence values, leaves events without a retained selected object unresolved, and admits kernel-selected identity only from a valid retained object observation. It never invents a stable candidate. Registered Rust tests and an independent exact-source checker cover the closed mapping and fail-closed cases. They do not prove Linux observations, object identity, complete execution, command integration, or released-artifact behavior."
subject = "rust:proofbound_runtime_diagnose_linux::mapping::DiagnosticEventMapper"
profile = "ledger"
tier = 1
evidence = [
  "example-test:diagnostic-event-mapping",
  "independent-check:diagnostic-event-mapping-contract",
]
assumptions = [
  "PBR-DIAGNOSTIC-DECODE-AX-017",
  "PBR-DIAGNOSTIC-MAP-CHECK-AX-019",
]
open_obligations = [
  "Run the complete source, compilation, unit, and independent-check evidence in hosted exact-head verification before merge.",
  "Resolve denied operands only to stable candidates after bounded drift checks.",
  "Couple mapping failure to diagnostic drain and explicit incomplete publication in the pbr-diagnose command.",
  "Run every registered event, malformed outcome, path-encoding, socket-address, exec, and sequence case on both supported native architectures.",
  "Bind the exact released diagnostic executable and observer mechanism identity before describing this mapper as released.",
]
out_of_scope = [
  "Correctness or completeness of Linux ptrace, syscall numbers, results, captured operands, process identity, or tracee memory.",
  "Correctness of the effectful filesystem object observation, socket object resolution, capability inference, automatic authority generation, or reusable receipt production.",
  "Command orchestration, output publication, native attack evidence, production execution, or released-artifact behavior.",
]
