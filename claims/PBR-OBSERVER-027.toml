schema = "proofbound-claim/1"
id = "PBR-OBSERVER-027"
title = "Diagnostic standard streams drain concurrently within independent bounds"
statement = "For the separate Linux diagnostic trace, raw nonblocking operation, and adapter source path, successful child creation takes the exact configured stdout and stderr pipes, makes them nonblocking, and starts one concurrent drain for each with shared cancellation before it returns the spawned trace state; each active drain retains at most its declared byte limit while continuing to read through end of file and records whether bytes were truncated; natural completion returns both captures only after the exact traced process tree is empty; forced termination returns both captures only after the exact tree drain succeeds; terminal collection waits under one fixed monotonic deadline, rejects drains that become ready or finish joining after expiry, and, if either drain remains unfinished at expiry, cancels and joins both drains before it returns a closed timeout; retaining the root pidfd before active-trace ownership and a raw exact terminal wait that reaps the root each disarm the numeric child cleanup guard; a missing pipe, nonblocking configuration failure, drain-thread creation failure, read failure, join failure, or terminal timeout returns a closed error and prevents diagnostic publication; and early setup-state destruction attempts child termination and wait, while active-trace destruction terminates through retained pidfds, cancels the nonblocking drains, and joins them."
public_language = "The separate diagnostic trace has source-level bounded concurrent stdout and stderr drains with shared cancellation. Each nonblocking stream retains only its independent byte prefix and continues draining after truncation. Captures become available only after exact natural completion or successful forced tree drain, and terminal collection has a fixed monotonic timeout that cancels both drains and fails closed. Retaining the root pidfd and an exact raw terminal wait that reaps the root each disarm later numeric child cleanup. Registered Rust tests and an independent exact-source checker cover the bounded drain, cleanup ownership, and fail-closed completion structure. They do not prove Linux pipe behavior, scheduler progress, process-tree truth, cgroup placement, wall-time enforcement, command integration, or released-artifact behavior."
subject = "rust:proofbound_runtime_linux::trace+proofbound_runtime_linux::sys::set_nonblocking+proofbound_runtime_diagnose_linux::adapter"
profile = "ledger"
tier = 1
evidence = [
