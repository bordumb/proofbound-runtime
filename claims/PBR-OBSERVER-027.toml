schema = "proofbound-claim/1"
id = "PBR-OBSERVER-027"
title = "Diagnostic standard streams drain concurrently within independent bounds"
statement = "For the separate Linux diagnostic trace source API, successful child creation takes the exact configured stdout and stderr pipes, makes them nonblocking, and starts one independently cancellable concurrent drain for each before it returns the spawned trace state; each active drain retains at most its declared byte limit while continuing to read through end of file and records whether bytes were truncated; natural completion returns both captures only after the exact traced process tree is empty; forced termination returns both captures only after the exact tree drain succeeds; a missing pipe, nonblocking configuration failure, drain-thread creation failure, read failure, or join failure returns a closed error and prevents diagnostic publication; and early typestate destruction terminates and waits for the child, cancels the nonblocking drains, and joins them."
public_language = "The separate diagnostic trace has source-level bounded, cancellable, concurrent stdout and stderr drains. Each nonblocking stream retains only its independent byte prefix, continues draining after truncation, and becomes available only after exact natural completion or successful forced tree drain. Registered Rust tests and an independent exact-source checker cover the bounded drain and fail-closed completion structure. They do not prove Linux pipe behavior, process-tree truth, cgroup placement, wall-time enforcement, command integration, or released-artifact behavior."
subject = "rust:proofbound_runtime_linux::trace::TraceOutputCapture"
profile = "ledger"
tier = 1
evidence = [
  "example-test:diagnostic-stream-capture",
  "independent-check:diagnostic-stream-capture-contract",
]
assumptions = [
  "PBR-DIAGNOSTIC-TRACE-AX-016",
  "PBR-DIAGNOSTIC-STREAM-CHECK-AX-020",
]
open_obligations = [
  "Run the complete source, compilation, unit, and independent-check evidence in hosted exact-head verification before merge.",
  "Place the same stopped traced child in its prepared cgroup before target release, apply one absolute plan wall-time deadline, and couple cleanup failure to incomplete publication.",
  "Exercise pipe saturation, asymmetric limits, read failure, timeout, forced drain, and descendant-held pipe descriptors on both supported native architectures.",
  "Connect both bounded captures to the separate pbr-diagnose command without treating diagnostic output as reusable production evidence.",
  "Bind the exact released diagnostic executable and observer mechanism identity before describing this collector as released.",
]
out_of_scope = [
  "Correctness or fairness of Linux pipes, threads, scheduling, reads, process status, ptrace, pidfds, or kernel process-tree events.",
  "Cgroup placement, resource cleanup, wall-time enforcement, filesystem object resolution, capability inference, or automatic authority generation.",
  "Command orchestration, durable artifact publication, native attack evidence, production execution, or released-artifact behavior.",
]
