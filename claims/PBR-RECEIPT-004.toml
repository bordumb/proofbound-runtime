schema = "proofbound-claim/1"
id = "PBR-RECEIPT-004"
title = "Incomplete executions are not reusable"
statement = "Receipt eligibility is reusable only for a structurally valid, boundary-installed execution that exits with code zero and has complete output streams; every other represented state is non-reusable with all applicable typed reasons."
public_language = "A kernel-checked theorem proves that the version 1 receipt model has exactly one reusable state and that every other represented state returns its complete nonempty canonical reason list. This theorem is model-only until source refinement and artifact binding are registered."
