title = "The current integration record closes one exact supported tuple"
statement = "Under the registered package, SDK, registry, Proofbound-bundle, and toolchain premises, the release workflow produces a deterministic-CBOR current-integration record only after all selected registry packages pass anonymous exact-byte observation; binds that record to one exact Runtime source revision, four Runtime artifacts, the eight embedded Runtime executable identities, four public packages, the current wire schemas and closed SDK error vocabularies, two Linux architecture profiles, and one exact Proofbound source, tool, and receipt-schema identity; admits no optional integration tuple; and independently verifies the record against every input before publishing its machine and human renderings."
public_language = "Runtime has a fail-closed producer and independent verifier for one exact current integration tuple. The protected release path can retain the record only after all four selected registry packages are anonymously observed and matched, and the record also names exact Runtime artifacts and embedded executables, schemas, SDK errors, platforms, and Proofbound identities. This is bounded source and workflow evidence: no current tuple is described as published until an exact protected run produces and retains it, and its digests do not authenticate a publisher."
