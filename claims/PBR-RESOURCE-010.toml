schema = "proofbound-claim/1"
id = "PBR-RESOURCE-010"
title = "Version two execution installs and observes memory and swap bounds"
statement = "For every supported version 2 execution, the Runtime installs and reads back the registered process, memory, swap, and OOM-group controls in the same fresh cgroup before child code starts, then records checked terminal observations from that cgroup without granting a larger modeled resource bound."
public_language = "The production version 2 path has closed control, observation, receipt-mutation, and native attack corpora. Required native workflows exercise the exact Runtime artifact on x86_64 and aarch64 and retain its kernel, cgroup, source, and binary context. This is bounded native exact-artifact observation, not theorem-derived artifact soundness or proof of the Linux kernel."
subject = "rust:proofbound_runtime_linux::FreshCgroup::create_v2"
profile = "ledger"
tier = 0
evidence = [
  "example-test:release-observe-runtime-linux-aarch64",
  "example-test:release-observe-runtime-linux-x86-64",
  "example-test:resource-boundary-attacks",
]
assumptions = [
  "PBR-LINUX-AX-001",
  "PBR-HOST-AX-002",
  "PBR-TOOLCHAIN-AX-003",
]
open_obligations = [
  "Publish version 0.2 only after both exact native release contexts reproduce, verify, and compose the version 2 artifacts at the mainline release revision.",
]
out_of_scope = [
  "Correctness of the Linux kernel, cgroup accounting, host administrator, hardware, firmware, compiler, or linker.",
  "A guarantee that memory.max never temporarily overshoots or that every failed allocation raises a registered event.",
  "Treating zero memory.swap.max as disabling zswap or treating a nonzero swap peak as a swap limit event.",
  "Memory classes and host resources outside the documented cgroup v2 accounting boundary.",
]
