schema = "proofbound-claim/1"
id = "PBR-SDK-014"
title = "Plan SDKs preserve the separate-process verification boundary"
statement = "The registered Rust, Python, and TypeScript SDK sources construct only the closed deterministic-CBOR version 2 plan, strictly decode only the non-verifying run-result JSON projection, and, where invocation is provided, launch one explicitly selected pbr process without a shell, ambient environment inheritance, retry, or unbounded output capture."
public_language = "The three source SDKs match the frozen plan bytes and reject registered construction, projection, process, and package attacks while leaving execution and verification in separate binaries. This is source and reproducible-package-check evidence, not registry authenticity or exact published-package evidence."
subject = "sdk:proofbound-runtime-plan-v2"
profile = "ledger"
tier = 1
