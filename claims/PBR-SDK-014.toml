  "PBR-TOOLCHAIN-AX-003",
]
open_obligations = [
  "Bind and publish the exact Rust, Python, and npm package artifacts at an independently approved version 0.2 tag.",
  "Dogfood each published SDK from a consumer repository without importing Runtime producer or verifier internals.",
]
