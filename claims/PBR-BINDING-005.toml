id = "PBR-BINDING-005"
title = "Reusable receipts bind security-relevant execution inputs"
statement = "Every reusable execution receipt binds the registered plan, compiled policy, platform, launcher, runtime, executable closure, inputs, outputs, limits, and observed outcome."
