title = "Selected packages publish only through the protected exact-source workflow"
statement = "Under the registered external registry and SDK toolchain premises, the release workflow publishes the selected verifier, Rust SDK, Python SDK, and TypeScript SDK packages only after explicit opt-in, exact-mainline validation, complete release provenance, and protected-environment approval; isolates registry credentials by publisher; reproduces Rust upload inputs against the approved artifacts; and anonymously retrieves all four registry artifacts for exact byte comparison."
public_language = "Runtime has an opt-in protected release path for its independent verifier and three SDK packages. The registered source checks require one exact mainline revision, ordered isolated publishers, exact Rust upload-input reproduction, and anonymous byte comparison after publication. This is workflow and bounded test evidence only: no package is described as published until an exact protected run and registry observations exist, and registry or workflow identity is not independently authenticated."
subject = "workflow:.github/workflows/release.yml#selected-package-publication"
profile = "ledger"
tier = 1
