schema = "proofbound-claim/1"
id = "PBR-SEQUENCE-003"
title = "Child code starts only after boundary installation"
statement = "Every supported execution that starts child code first installs the registered cgroup, privilege, filesystem, and syscall boundaries for the same compiled policy identity."
public_language = "The production launcher uses a typed acknowledgement gate that rejects execution before boundary installation, and the required native corpus observes the installed boundary and registered denials on x86_64 and aarch64 Linux. This is bounded platform evidence, not a proof of Linux or exact release artifacts."
