schema = "proofbound-claim/1"
id = "PBR-ACCEPT-012"
title = "Adopter policy decisions bind independently verified inputs"
statement = "Given an independently selected acceptance policy identity, execution commitment and execution ID, exact Runtime and Proofbound release inputs, and successful independent verification, pbr-accept emits accepted only when every registered execution, release, claim-facet, assumption, exclusion, obligation, and trusted-computing-base policy predicate holds; otherwise it emits every applicable typed rejection reason bound to the exact inputs."
public_language = "The acceptance evaluator strictly decodes a deterministic-CBOR adopter policy, re-runs both independent verifiers over raw inputs, and binds a canonical decision to the policy, execution, release, verifier, composer, and acceptor identities. The current evidence is a closed source-level attack corpus and CLI contract, not a proof of external policy selection, artifact storage authenticity, or exact released pbr-accept bytes."
subject = "rust:proofbound_runtime_accept::evaluate"
profile = "ledger"
tier = 0
evidence = [
  "example-test:receipt-acceptance-attacks",
  "example-test:receipt-acceptance-cli",
]
assumptions = [
  "PBR-COMMITMENT-AX-007",
  "PBR-POLICY-SELECTION-AX-009",
  "PBR-TOOLCHAIN-AX-003",
]
open_obligations = [
  "Observe both independently reproduced pbr-accept release artifacts at the exact version 0.2 mainline revision.",
  "Dogfood the pinned Action in an external sample repository and retain its exact decision identity and workflow run.",
]
out_of_scope = [
  "Authenticity or confidentiality of GitHub Actions artifact storage.",
  "Authenticity of a policy identity delivered through the same replaceable carrier as the policy bytes.",
  "Age-based freshness, trusted current time, signatures, transparency logs, or a receipt database.",
  "Correctness of the independently supplied Proofbound and Runtime verifier binaries beyond their separately admitted claims and visible identities.",
  "Promotion of any Proofbound claim facet by the acceptance evaluator.",
]
