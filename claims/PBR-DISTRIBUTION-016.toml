schema = "proofbound-claim/1"
id = "PBR-DISTRIBUTION-016"
title = "Runtime consumes one exact immutable Proofbound tool bundle"
statement = "Under the registered distribution and toolchain premises, the Runtime consumer accepts one canonical pin for a public immutable Proofbound exact-source release, resolves the hosted tag to the pinned source, rechecks the exact release identity and closed asset inventory, binds the detached and embedded platform manifests, verifies every selected byte identity and publication link before execution, and dogfoods those pinned bytes in an isolated hosted CI job without giving them authority over Runtime evidence."
public_language = "Under its registered GitHub, TLS, Python, installer, runner, process, filesystem, and digest premises, Runtime's Proofbound tool consumer rejects noncanonical pins, wrong tag targets, mutable or substituted releases, changed inventories, carriers, manifests, checksums, archives, installers, and installed executable bytes. An isolated hosted CI job installs and executes the exact public bundle identities committed in Runtime, while the existing evidence path remains unchanged during the parity wave. This is bounded distribution-consumer evidence; it does not authenticate GitHub independently or prove that the upstream build system produced correct behavior."
subject = "distribution:proofbound-tool-bundle"
profile = "ledger"
tier = 1
evidence = [
  "independent-check:proofbound-tool-bundle-consumer",
]
assumptions = [
  "PBR-BUNDLE-DISTRIBUTION-AX-012",
  "PBR-BUNDLE-TOOLCHAIN-AX-013",
]
open_obligations = [
  "Replace cross-repository Proofbound source compilation in protected CI and release production only after the independently reviewed public-bundle dogfood wave passes at an exact Runtime main revision.",
]
out_of_scope = [
  "Correctness of the Proofbound binaries, pinned Proofbound installer, Rust compiler, GitHub Actions runner, GitHub release service, TLS implementation, Python interpreter, archive implementation, cryptographic digest implementation, filesystem, process implementation, or operating system.",
  "Independent publisher authentication, artifact signing, transparency logging, revocation, availability, or rollback selection policy.",
  "Compatibility with any Proofbound source or artifact identity other than the exact committed pin.",
]
