schema = "proofbound-claim/1"
id = "PBR-DISTRIBUTION-015"
title = "The independent verifier has a closed reproducible public package"
statement = "The registered verifier package preflight admits only the exact public manifest surface, source inventory, package payload, Cargo-retained source identity, and crates.io-only non-Runtime dependency closure; release production builds that package twice to byte equality, installs the extracted package in an unrelated temporary consumer, and joins the exact package into aggregate release provenance before retaining its identity."
public_language = "The independent verifier crate rejects the registered manifest-surface, dependency-source, inventory, packaged-source, Cargo-metadata, source-identity, and reproduction attacks. Its local release package is byte-reproduced, installed outside the workspace, and included in checked aggregate provenance. This is source and local-package evidence, not registry publication, registry-byte identity, publisher authentication, or proof of verifier semantics."
subject = "package:proofbound-runtime-verify"
profile = "ledger"
tier = 1
evidence = [
  "independent-check:verifier-package-contract",
]
assumptions = [
  "PBR-PACKAGE-TOOLCHAINS-AX-011",
]
open_obligations = [
  "Accept Specification 0014 through independent review before registry publication.",
  "Bind the exact retained verifier package to an independently approved release revision.",
  "Publish from the approved release workflow, retrieve the registry package, and compare its exact identity.",
  "Dogfood the retrieved registry package from an unrelated consumer repository.",
]
out_of_scope = [
  "Correctness of receipt verification, receipt production, composition, acceptance, or Linux boundary installation.",
  "Authenticity, availability, immutability, or correct operation of crates.io or another package registry.",
  "Publisher authentication, release signing, or authorization to perform a registry publication.",
  "Proof that Cargo, Python, tar, gzip, the Rust compiler, or the host filesystem preserve the registered package behavior.",
]
