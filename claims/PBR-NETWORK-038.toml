schema = "proofbound-claim/1"
id = "PBR-NETWORK-038"
title = "Single-service connector bounds DNS and authenticates the declared TLS name"
statement = "The proposed connector engine takes one complete validated service authority, sends DNS only to its declared numeric resolver over TCP under absolute deadlines, validates query-bound responses and a bounded loop-free CNAME and canonical address result whose effective lifetime includes every alias, attempts only that authority's ordered answer prefix, authenticates an exact non-wildcard DNS SAN with caller-supplied trust-root bytes, an explicit ring provider, and the declared minimum TLS version while disabling resumption and early data, and exposes only one duration-bounded and directionally byte-bounded opaque plaintext session without reconnect or application parsing."
public_language = "Runtime contains a proposed production connector engine for one authenticated service session. Registered source tests cover its closed error vocabulary, complete-authority binding, DNS wire parser, transaction and TTL rejection, CNAME conflict and lifetime behavior, canonical address order, exact non-wildcard DNS-name rule, explicit provider selection, deadline error class, trust-root fail-closed behavior, and endpoint-result classification. This is Tier 0 source evidence. It does not yet establish a supervised connector process, launcher binding, child syscall isolation, native enforcement, receipt production, or release-artifact behavior."
subject = "rust:proofbound_runtime_connector::{resolve_service,authenticate_service,proxy_authenticated_channel,DnsResolution}"
profile = "ledger"
tier = 0
evidence = [
  "example-test:authenticated-service-connector-engine",
]
assumptions = [
  "PBR-DNS-AX-004",
  "PBR-TLS-AX-005",
]
open_obligations = [
  "Run the connector as one separately identified and supervised process with an exact executable and runtime-closure identity.",
  "Resolve, revalidate, and bind the declared resolver-configuration and trust-root artifacts before supplying their bytes to the connector engine.",
  "Bind successful and failed DNS, endpoint, TLS, channel, counter, and cleanup observations into the service launcher acknowledgement and production receipt.",
  "Run the complete resolver, TLS, inherited-channel, direct-network, limit, crash, and cleanup attack corpus on x86_64 and aarch64 release artifacts.",
  "Independently review the rustls version, crypto-provider configuration, trust-root parsing, DNS parser, proxy loop, and every effectful error path.",
]
out_of_scope = [
  "Any claim that the production CLI accepts service-session plans or that a launcher or child uses this engine.",
  "Correctness of the resolver, DNS transport, rustls, ring, x509-cert, certificate authorities, remote service, kernel, hardware, or host operator.",
  "HTTP, LLM, request, response, credential, redirect, proxy, multiple-session, reconnect, QUIC, or application-operation semantics.",
]
