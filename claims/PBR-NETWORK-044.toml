schema = "proofbound-claim/1"
id = "PBR-NETWORK-044"
title = "Egress receipts record declared and observed endpoints and verify independently"
statement = "The version 3 execution receipt records the complete declared-egress authority, namespace and listener boundary, proxy identities and lifecycle, every resolution, every proxied connection with its endpoint, selected address, attempts, SNI result, bytes, and close reason, every rejection by reason, digest, and length, the counters, the limit events, and cleanup; the independent verifier rejects every relation violation in Specification 0017 section 8.2 and derives the canonical reuse eligibility and non-reuse reasons of section 8.3."
public_language = "Registered at Tier 0 only. Specification 0017 defines the egress observation fragment, independent relations, reuse rules, and stable codes. No producer, verifier path, vector, or mutation corpus exists yet."
subject = "schema:proofbound-runtime-execution-receipt/3+rust:proofbound_runtime_verify::egress"
